spring.application.name=LogisticsApplication

server.port=8081

# MySQL (type your own MySQL username and password here)
spring.datasource.url=jdbc:mysql://localhost:3306/logisticsdb?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=Yasarmeera@24
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Connection pool (HikariCP)
spring.datasource.hikari.pool-name=LogisticsPool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000

# Login passwords
app.security.admin-password=admin123
app.security.staff-password=staff123

# File upload
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
app.upload-dir=uploads

# Actuator (health details are shown only to logged-in users)
management.endpoints.web.exposure.include=health,info,metrics,caches
management.endpoint.health.show-details=when-authorized

# Logging
logging.level.com.logisticsapp=INFO